<!doctype html>
<html lang="ja" class="popup-page">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jev-Ad blocker</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="icon" type="image/png" href="icons/icon-32.png" />
  </head>
  <body class="popup">
    <header>
      <div class="popup-heading">
        <h1>Jev-Ad blocker</h1>
        <button id="settings" class="link">設定</button>
      </div>
      <p id="origin" class="muted">ページを確認中…</p>
    </header>
    <main>
      <section class="section scan">
        <button class="primary full" id="toggle">広告を削除</button>
        <div class="stats">
          <div><strong id="tested">0</strong><span>確認した候補</span></div>
          <div><strong id="removed">0</strong><span>削除した広告</span></div>
        </div>
        <p id="status" role="status"></p>
        <div class="row">
          <button id="undo" disabled>直前を戻す</button><button id="undoAll" disabled>すべて戻す</button>
        </div>
      </section>
      <section class="section">
        <label class="check"
          ><input type="checkbox" id="automatic" /><span>すべてのサイトで自動判定</span></label
        >
        <p id="automaticState" class="muted"></p>
      </section>
      <div id="notice" role="status" aria-live="polite"></div>
      <details id="advanced">
        <summary>詳細設定</summary>
        <form id="thresholdForm" novalidate>
          <label for="threshold">広告を削除する基準</label>
          <div class="threshold-row">
            <input
              id="threshold"
              type="number"
              min="50"
              max="100"
              step="1"
              value="80"
              required
              aria-describedby="thresholdHelp thresholdError"
            /><span>%</span><button type="submit">保存</button>
          </div>
          <p id="thresholdHelp" class="muted">初期値80%。高くすると誤削除を抑えられます（50〜100%）。</p>
          <p id="thresholdError" class="error" role="alert"></p>
        </form>
        <label for="mode">実行モード</label
        ><select id="mode">
          <option value="remove">広告を削除</option>
          <option value="diagnostic">判定だけ（削除しない）</option>
        </select>
        <details>
          <summary>判定結果</summary>
          <div id="decisions"></div>
        </details>
      </details>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
